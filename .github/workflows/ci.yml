name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ─────────────────────────────────────────
  # 1. Lint & Type-check
  # ─────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (web)
        run: pnpm --filter web exec tsc --noEmit

      - name: Type-check (worker)
        run: pnpm --filter worker exec tsc --noEmit

      - name: Type-check (packages)
        run: pnpm --filter "@hitechbenchmark/*" exec tsc --noEmit

  # ─────────────────────────────────────────
  # 2. Build
  # ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      NEXTAUTH_SECRET: ci-secret-placeholder-32chars-long
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      BENCHMARK_SIGNING_SECRET: ci-signing-secret-placeholder
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter db exec prisma generate

      - name: Build web app
        run: pnpm --filter web build

      - name: Build worker
        run: pnpm --filter worker build

  # Docker is intentionally not used for Node.js app images.
  # The production installer runs web and worker directly on the host.
