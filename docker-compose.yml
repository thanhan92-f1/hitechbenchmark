version: '3.9'

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  database:
    image: postgres:16-alpine
    container_name: hitechbench_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hitechbenchmark
      POSTGRES_USER: hitechbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitechbench -d hitechbenchmark"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hitechbench

  # ============================================================
  # Redis Cache & Queue
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: hitechbench_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hitechbench

  # ============================================================
  # Next.js Web App (Frontend + API)
  # ============================================================
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        - NODE_ENV=production
    container_name: hitechbench_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hitechbench:${POSTGRES_PASSWORD:-password}@database:5432/hitechbenchmark
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: ${APP_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      BENCHMARK_SIGNING_SECRET: ${BENCHMARK_SIGNING_SECRET}
      NEXT_PUBLIC_SITE_URL: ${APP_URL:-http://localhost}
      NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost}
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - hitechbench

  # ============================================================
  # BullMQ Worker
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: hitechbench_worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hitechbench:${POSTGRES_PASSWORD:-password}@database:5432/hitechbenchmark
      REDIS_URL: redis://redis:6379
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hitechbench

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:1.24-alpine
    container_name: hitechbench_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - hitechbench

volumes:
  postgres_data:
  redis_data:
  nginx_certs:
  nginx_logs:

networks:
  hitechbench:
    driver: bridge
