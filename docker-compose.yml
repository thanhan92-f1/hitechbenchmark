services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  database:
    image: postgres:16-alpine
    container_name: hitechbench_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hitechbenchmark
      POSTGRES_USER: hitechbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitechbench -d hitechbenchmark"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hitechbench

volumes:
  postgres_data:

networks:
  hitechbench:
    driver: bridge
